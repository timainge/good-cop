[project]
name = "good-cop"
version = "0.1.0"
description = "Local-first observer and rule checker for Claude Code sessions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "pyyaml>=6"]

[project.scripts]
good-cop = "good_cop.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/good_cop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
