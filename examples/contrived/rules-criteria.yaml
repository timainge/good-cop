# The contrived rules rewritten in TypeSafe's style: questions point at state paths, and
# `criteria` define what yes and no mean. Ids, tools and thresholds match rules.yaml, so
# autolabel.py's labels apply unchanged. Jev receives criteria natively (noul criteria);
# text LLMs get the same definitions appended to the question.
enforce: false
defaults: {threshold: 0.5, action: log}

rules:
  - id: edits_markdown
    when: {tools: [Write, Edit, MultiEdit]}
    question: Does the pending tool call `call` create or modify a Markdown (.md) file?
    criteria:
      true: The file at `call.input.file_path` has a .md extension and the call writes or edits it.
      false: The file being written or edited has any other extension (.ts, .py, .json, .mdx, .yaml, ...).

  - id: runs_tests
    when: {tools: [Bash]}
    question: Does the shell command in `call.input.command` execute an automated test suite?
    criteria:
      true: >
        The command runs a test runner, directly or through a package script: pytest, vitest,
        jest, playwright test, go test, cargo test, make test, npm/pnpm/yarn test, or an npm
        script such as `npm run check` whose job includes running the tests.
      false: >
        The command only writes, reads, searches, lists, lints, type-checks, formats or builds
        files. Writing a test file, reading a test config or grepping test names without
        running a test runner is not running tests.

  - id: git_commit
    when: {tools: [Bash]}
    question: Does the shell command in `call.input.command` create a git commit?
    criteria:
      true: It runs `git commit`, with any options (for example `git -C dir commit` or `git -c user.name=x commit`).
      false: >
        It runs only other git commands (status, add, diff, log, push, show) or no git at all.
        A commit message, heredoc or file that merely contains the words "git commit" does not count.

  - id: git_commit_pattern
    when: {tools: [Bash]}
    pattern: '\bgit\s+(-[cC]\s+("[^"]*"|\S+)\s+)*commit\b'

  - id: runs_session_script
    when: {tools: [Bash]}
    question: Does `call.input.command` execute a script file that this session wrote or edited earlier?
    criteria:
      true: >
        `resolved.script.written_this_session` is true, or the command runs (./file, bash file,
        python file, node file) a path listed in `ledger.files_written`.
      false: >
        The command runs no local script file, runs a script that is not in `ledger.files_written`
        (for example a pre-existing repo script), runs inline code (`python3 - <<EOF`, `node -e`),
        or only writes, edits or reads a script without running it.

  - id: web_access
    when: {tools: [Bash, WebFetch, WebSearch]}
    question: Does the pending tool call `call` access the web?
    criteria:
      true: >
        `call.tool` is WebFetch or WebSearch, or `call.input.command` runs curl or wget
        (against any URL, including localhost).
      false: >
        Any other tool or command, including git, gh, npm/pip installs, or scripts that may
        make requests themselves without invoking curl or wget in the command.
