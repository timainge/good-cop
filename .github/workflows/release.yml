name: release
# On a v* tag: test, build, publish to TestPyPI, then PyPI, with trusted publishing (GitHub OIDC; no
# token in the repo). One-time setup by the owner: add a trusted publisher for this repo/workflow on
# both pypi.org and test.pypi.org (environment names `testpypi` and `pypi`).
on:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync && uv run pytest -q
      - name: tag matches the package version
        run: test "v$(uv run python -c 'import good_cop; print(good_cop.__version__)')" = "$GITHUB_REF_NAME"
      - run: uv build
      - uses: actions/upload-artifact@v4
        with: {name: dist, path: dist/}

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions: {id-token: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: {repository-url: "https://test.pypi.org/legacy/"}

  pypi:
    needs: testpypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions: {id-token: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - uses: pypa/gh-action-pypi-publish@release/v1
