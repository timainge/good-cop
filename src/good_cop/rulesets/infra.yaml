# infra: agents working near real infrastructure (kubernetes, terraform, cloud CLIs).
# Combine with the default: `include: [solo-dev, infra]`.
description: agents near real infrastructure (kubernetes, terraform, cloud CLIs)

rules:
  - id: kube_prod_context
    when: {tools: [Bash], command: '\b(?:kubectl|helm|kustomize|k9s|kubectx|argocd|flux)\b'}
    fact: ledger.env.kube_context
    matches: '(?i)prod'

  - id: aws_prod_profile
    when: {tools: [Bash], command: '\b(?:aws|terraform|tofu|cdk|sam|pulumi|serverless|sls)\b'}
    fact: ledger.env.aws_profile
    matches: '(?i)prod'

  - id: prod_flag                  # a prod target named on the command line
    when: {tools: [Bash]}
    pattern: '(?i)(?:--context|--kube-context|--profile|--project|--subscription|-var-file|--env|--environment|--stage)[= ]["'']?[\w./:-]*prod|\b(?:use-context|workspace\s+select)\s+["'']?[\w./:-]*prod'

  - id: prod_in_script             # the same, inside a script the call runs
    fact: resolved.script.head
    matches: '(?i)(?:--context|--kube-context|--profile|--project|--subscription|-var-file|--env|--environment|--stage)[= ]["'']?[\w./:$-]*prod|\b(?:use-context|workspace\s+select)\s+["'']?[\w./:$-]*prod|\bAWS_PROFILE=["'']?[\w-]*prod'

  - id: terraform_apply_destroy
    when: {tools: [Bash]}
    pattern: '\b(?:terraform|tofu|terragrunt)\s+(?:-\S+\s+)*(?:apply|destroy)\b|\b(?:cdk|pulumi)\s+(?:-\S+\s+)*(?:deploy|destroy|up)\b'

  - id: cloud_delete
    when: {tools: [Bash]}
    # aws <svc> delete-*/terminate-*, gcloud/az/doctl … delete, kubectl delete, helm uninstall
    pattern: '\baws\b[^;&|\n]*\s(?:delete|terminate|remove|deregister|purge)-[\w-]+|\b(?:gcloud|az|doctl|flyctl|heroku)\b[^;&|\n]*\s(?:delete|destroy|remove)\b|\bkubectl\s+(?:-\S+\s+)*delete\b|\bhelm\s+(?:-\S+\s+)*(?:uninstall|delete)\b|\baws\s+s3\s+(?:rm|rb)\b'

  - id: iam_change
    when: {tools: [Bash]}
    pattern: '\baws\s+iam\s+(?:create|attach|put|update|delete|detach|add|remove)-\S+|\bgcloud\b[^;&|\n]*\s(?:add-iam-policy-binding|remove-iam-policy-binding|set-iam-policy)\b|\baz\s+role\s+(?:assignment|definition)\s+(?:create|delete|update)\b|\bkubectl\s+(?:-\S+\s+)*create\s+(?:cluster)?rolebinding\b'

  - id: prod_target                # overrides solo-dev's wording when both are included
    when: {tools: [Bash, "mcp__*"]}
    question: >
      Given `ledger.env` (kube_context, aws_profile, tf_workspace), `resolved.script` and the command,
      does the pending tool call deploy to, modify, or run commands against production infrastructure?
    criteria:
      true: >
        The command, its flags (--context, --profile, -var-file, --project, --subscription), a script it
        runs, or the recorded environment points at production, and the call changes or executes something
        there (apply, deploy, rollout, scale, exec, delete, migrate, write).
      false: >
        It targets dev, test or staging, only reads (get, describe, plan, logs) or nothing in the state
        shows a production target.
