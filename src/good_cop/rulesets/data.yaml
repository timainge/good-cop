# data: agents working near databases and datasets.
# Combine with the default: `include: [solo-dev, data]`.
description: agents near databases and datasets

rules:
  - id: sql_drop_truncate
    when: {tools: [Bash, "mcp__*"]}
    pattern: '(?i)\bdrop\s+(?:table|database|schema|view|index|collection)\b|\btruncate\s+(?:table\s+)?["`\w]|\.drop\(\s*\)|\bdropDatabase\('

  - id: delete_without_where
    when: {tools: [Bash, "mcp__*"]}
    # DELETE FROM t; with no WHERE before the end of the statement
    pattern: '(?i)\bdelete\s+from\s+[\w."`\[\]]+\s*(?:;|$|["''\\])'

  - id: bulk_data_change
    when: {tools: [Bash, "mcp__*"]}
    question: >
      Does the pending tool call in `call` delete or overwrite many rows, documents or files of data
      at once, outside a local throwaway database?
    criteria:
      true: >
        An UPDATE or DELETE without a selective WHERE clause, deleteMany({}) or similar, a bulk import
        that replaces existing data, aws s3 sync --delete, or a script that does any of these, against a
        database or bucket that is not a local test instance.
      false: >
        Changes to a handful of rows by key, changes against a local or test database (localhost, sqlite
        in the repo, docker test containers), schema-only changes, or read-only queries.

  - id: migration_non_local
    when: {tools: [Bash, "mcp__*"]}
    question: >
      Does the pending tool call run database schema migrations against a database that is not local?
    criteria:
      true: >
        It runs a migration tool (alembic upgrade, prisma migrate deploy, rails db:migrate, django migrate,
        flyway migrate, knex migrate, sqitch deploy, goose up, liquibase update) and the database URL,
        host, environment or profile in the command or `ledger.env` points at a shared, staging or
        production database.
      false: >
        It generates migration files without applying them, applies them to localhost / sqlite / a test
        container, or does not run migrations at all.

  - id: personal_data_export
    when: {tools: [Bash, "mcp__*"]}
    question: >
      Does the pending tool call export, dump or copy data that likely contains personal information
      (users, customers, emails, addresses, payments, health) out of its database?
    criteria:
      true: >
        pg_dump / mysqldump / mongoexport of tables or collections with people's data, COPY ... TO or
        SELECT ... INTO OUTFILE of such tables, or uploading such an export to a bucket, chat or third party.
      false: >
        Schema-only dumps, dumps of non-personal tables, anonymised or synthetic data, or reading a few
        rows to debug inside the database session.
