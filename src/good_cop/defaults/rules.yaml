# good-cop rules. `good-cop install` copies this to ~/.good-cop/rules.yaml.
# Starter rulesets (`good-cop rules list`): solo-dev, infra, data, unattended. Later includes win;
# rules merge by id, so a rule below with an included id retunes it (`{id: prod_target, threshold: 0.95}`)
# and `{id: x, disabled: true}` drops it. `good-cop rules show` prints the merged result.
include: [solo-dev]

enforce: false          # false = log only, regardless of rule actions

# handlers:              # named side effects for tripped rules (https://github.com/timainge/good-cop/wiki/Handlers)
#   slack:  {type: webhook, url: "${SLACK_WEBHOOK_URL}", body: {text: "good-cop {action}: {rules}"}, only: [ask, deny]}
#   syslog: {type: command, command: "logger -t good-cop"}
# (then add `on_trip: [slack]` to a rule, or `on_trip: [syslog]` under defaults)
defaults: {threshold: 0.6, action: ask}

rules: []
# Your own rules go here, e.g.
#  - id: no_main_commits
#    when: {tools: [Bash], command: '\bgit\s+commit\b'}
#    fact: ledger.env.git_branch
#    in: [main, master]
